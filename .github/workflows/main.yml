name: Build IDT Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build IDT APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          SDKMANAGER=$(find "$ANDROID_HOME" \
            -type f \
            -name sdkmanager \
            2>/dev/null | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: Android SDK manager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses \
            >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          mkdir -p extracted

          for ZIP in $(find . -maxdepth 2 -type f -name "*.zip"); do
            echo "Extracting: $ZIP"
            unzip -oq "$ZIP" -d extracted
          done

      - name: Locate correct Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          while IFS= read -r APP_DIR; do
            POSSIBLE_ROOT=$(dirname "$APP_DIR")

            if [ -f "$POSSIBLE_ROOT/settings.gradle" ] ||
               [ -f "$POSSIBLE_ROOT/settings.gradle.kts" ]; then
              PROJECT_DIR="$POSSIBLE_ROOT"
              break
            fi
          done < <(find "$GITHUB_WORKSPACE" \
            -type d \
            -path "*/app" \
            -not -path "*/.git/*")

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Complete Android project was not found"
            echo "Folders discovered:"
            find "$GITHUB_WORKSPACE" -maxdepth 6 -type d
            exit 1
          fi

          echo "Correct project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Check Android project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "Project contents:"
          ls -la

          if [ ! -d "app" ]; then
            echo "ERROR: app folder is missing"
            exit 1
          fi

          if [ ! -f "settings.gradle" ] &&
             [ ! -f "settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle is missing"
            exit 1
          fi

          echo "Android project check passed"

      - name: Show Gradle tasks
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e
          gradle tasks --all

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created"
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IDT-Installation-Signoff-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
