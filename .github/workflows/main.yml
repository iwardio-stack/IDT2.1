name: Build IDT Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build IDT APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          mkdir -p extracted

          ZIP_FILE="IDT_FIXED_WORKING_PROJECT.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "Selected ZIP not found: $ZIP_FILE"
            echo "Available ZIP files:"
            find . -maxdepth 1 -name "*.zip"
            exit 1
          fi

          unzip -q -o "$ZIP_FILE" -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 4 -type f | head -100

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          while IFS= read -r SETTINGS; do
            POSSIBLE_DIR=$(dirname "$SETTINGS")

            if [ -d "$POSSIBLE_DIR/app" ]; then
              PROJECT_DIR="$POSSIBLE_DIR"
              break
            fi
          done < <(find extracted -type f \
            \( -name "settings.gradle" -o \
               -name "settings.gradle.kts" \))

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project with app folder not found"
            find extracted -maxdepth 6 -type d
            exit 1
          fi

          PROJECT_DIR=$(realpath "$PROJECT_DIR")

          echo "Android project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Check Android project
        shell: bash
        run: |
          set -e

          echo "Project directory: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"
          ls -la "$PROJECT_DIR/app"

          test -d "$PROJECT_DIR/app"

      - name: Show Gradle tasks
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle tasks --all --no-daemon

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Find APK
        shell: bash
        run: |
          find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IDT-Installation-Signoff-APK
          path: |
            extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
