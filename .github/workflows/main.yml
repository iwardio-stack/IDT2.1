name: Build IDT Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build IDT APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Find Android project
        run: |
          echo "Searching for Android project..."

          if [ -f "settings.gradle" ]; then
            echo "Project found in root folder"
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"

          elif [ -f "app/settings.gradle" ]; then
            echo "Project found in app folder"
            echo "PROJECT_DIR=app" >> "$GITHUB_ENV"

          else
            PROJECT=$(find . -name "settings.gradle" -type f | head -n 1)

            if [ -z "$PROJECT" ]; then
              echo "ERROR: settings.gradle not found"
              exit 1
            fi

            PROJECT_DIR=$(dirname "$PROJECT")
            echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          fi

      - name: Check Android project
        run: |
          echo "Project directory: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"
          test -f "$PROJECT_DIR/settings.gradle"

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IDT-Installation-Signoff-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
