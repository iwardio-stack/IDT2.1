name: Build IDT Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build IDT APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
          accept-android-sdk-licenses: true

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          sdkmanager --update || true

          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          if [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"

          else
            PROJECT=$(find . -type f \( \
              -name "settings.gradle" -o \
              -name "settings.gradle.kts" \
            \) | head -n 1)

            if [ -z "$PROJECT" ]; then
              echo "ERROR: settings.gradle not found"
              exit 1
            fi

            echo "PROJECT_DIR=$(dirname "$PROJECT")" >> "$GITHUB_ENV"
          fi

      - name: Check project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          pwd
          ls -la
          test -d app

      - name: Show Gradle tasks
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle tasks --all --no-daemon

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IDT-Installation-Signoff-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
